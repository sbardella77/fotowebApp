name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Validate PR release scope
        if: github.event_name == 'pull_request'
        run: node scripts/check-pr-release-scope.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
